name: Repository maintenance

on:
  push:
    paths:
      - .github/workflows/repository-maintenance.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REPO_DESCRIPTION: Supervised Rust control-plane node with revisioned SQLite state, ordered SSE events, deterministic service lifecycles, and isolated live/lab realms.
    steps:
      - name: Finalize repository presentation
        shell: bash
        run: |
          set +e

          gh api --method PATCH "repos/${REPOSITORY}"             -f "description=${REPO_DESCRIPTION}"

          gh api --method PUT "repos/${REPOSITORY}/topics" --input - <<'JSON'
          {
            "names": [
              "rust",
              "axum",
              "sqlite",
              "backend-architecture",
              "control-plane",
              "event-driven-architecture",
              "server-sent-events",
              "docker",
              "infrastructure",
              "systems-programming",
              "observability",
              "vps",
              "runtime",
              "api"
            ]
          }
          JSON

          gh api --method DELETE             "repos/${REPOSITORY}/git/refs/heads/docs/security-boundary"

          exit 0

      - name: Remove maintenance workflow
        if: always()
        shell: bash
        run: |
          workflow_sha="$(gh api "repos/${REPOSITORY}/contents/.github/workflows/repository-maintenance.yml?ref=main" --jq .sha)"
          gh api --method DELETE             "repos/${REPOSITORY}/contents/.github/workflows/repository-maintenance.yml"             -f "message=chore: remove completed repository maintenance"             -f "sha=${workflow_sha}"             -f "branch=main"
